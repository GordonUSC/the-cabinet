<!-- STYLE: candy-chrome glam toy tower: glossy 3D vinyl-toy tiles (Blender), warm pastels with polished gold and chrome, soft studio light, showroom-disco sparkle, rounded Fredoka type with a Pacifico script flourish | WHY: Joe loves match-3, glamour, speed, building a tower and remodeling homes, so every match remodels a room and the tower grows to a party penthouse; deliberately the opposite of Gordon's black screen-print rave poster | ALT: a flat paper-cut dollhouse look was considered and rejected as too quiet for a birthday disco -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd9e6">
<title>Joe's Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#ffe4ef; --bg2:#ffd8c4; --bg3:#e9d6ff; --ink:#5a2a55; }
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; overscroll-behavior:none;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%); background-attachment: fixed;
    font-family: Fredoka, system-ui, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.7) 0 2px, transparent 3px) 0 0/90px 90px,
                radial-gradient(circle at 70% 60%, rgba(255,230,160,.8) 0 1.5px, transparent 2.5px) 0 0/130px 130px; opacity:.6; }
  #game { position:fixed; inset:0; width:100%; height:100%; height:100dvh; display:flex; align-items:center; justify-content:center; }
  #game canvas { touch-action:none; display:block; border-radius:0; box-shadow: 0 20px 60px rgba(150,60,120,.18); }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:16px; box-sizing:border-box; }
  #loading h1 { font-family: Pacifico, cursive; font-weight:400; font-size: clamp(36px, 10vw, 64px); margin:0; color:#d4588f; text-shadow: 0 3px 0 #fff, 0 8px 24px rgba(212,88,143,.35); }
  #loading p { margin:0; font-size:18px; font-weight:600; }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .card { background: rgba(255,255,255,.75); border: 3px solid #e9b94a; border-radius: 24px; padding: 20px 24px; max-width: 360px; }
</style>
</head>
<body>
<p class="sr">Joe's Tower: a match-3 game. Swap pieces to collect materials, remodel each room, and build the tower floor by floor from the lobby to the penthouse. Relaxed mode has no move limit.</p>
<div id="game" role="application" aria-label="Joe's Tower match-3 board"></div>
<div id="loading"><h1>Joe's Tower</h1><p id="loadmsg">Polishing the chrome...</p></div>
<noscript><div class="card" style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)"><b>Joe's Tower</b><br>This game needs JavaScript turned on. Flip it on, reload, and the lobby doors will open.</div></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
