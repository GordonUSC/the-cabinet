<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GGP · Francesco design review</title>
<style>
:root{--ink:#162b2d;--dim:#4f6664;--paper:#f9f6ee;--line:#d6dfd7;--white:#fffefa;--green:#126451;--violet:#503980;--amber:#6b420b;font:16px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #7851ae}button,.pill{min-height:44px;border-radius:9px;padding:.55rem .85rem;background:var(--white);border:1px solid #b7c9c1;color:var(--ink);font-weight:650}button:hover{border-color:var(--green)}button[aria-pressed=true],.btn{background:#164f42;color:#fff;border-color:#164f42}button[disabled]{opacity:.52;cursor:not-allowed}.strip{background:#163a34;color:#f0fbf5;padding:12px clamp(16px,4vw,64px);display:flex;justify-content:space-between;gap:12px;font-size:.83rem;letter-spacing:.07em}.strip strong{letter-spacing:.16em}.frame{max-width:1360px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding:30px 30px 55px}aside{position:sticky;top:20px;align-self:start;padding:8px 0}.caption,.eyebrow{font-size:.8rem;letter-spacing:.13em;text-transform:uppercase;color:var(--green);font-weight:800}.caption{margin:12px 0 8px}.nav{display:grid;gap:5px}.nav button{text-align:left;border-color:transparent;background:transparent}.nav button[aria-pressed=true]{border-color:#bfd7cd;background:#e2eee7;color:#163e34}.subnav{margin-top:25px}.railnote{margin-top:28px;border-top:1px solid var(--line);padding-top:18px;color:var(--dim);font-size:.83rem}.hero{padding:clamp(18px,4vw,36px);min-height:190px;border-radius:19px;background:#dfeee4;position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) minmax(130px,29%);align-items:center;gap:18px}.hero h1{font:700 clamp(2.25rem,5.5vw,4.4rem)/.94 Georgia,serif;letter-spacing:-.055em;margin:.35rem 0 .7rem;max-width:12ch}.hero p{max-width:47ch;margin:0;color:#355d54}.art{height:145px;width:100%;justify-self:end;object-fit:contain}.controls{background:var(--white);border:1px solid var(--line);padding:13px;border-radius:13px;margin-top:16px}.controls label{display:block;font-weight:750}.search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.search input{height:44px;padding:6px 11px;border:1px solid #819b90;border-radius:8px;width:100%;color:var(--ink);background:white}.filters{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}.filters button{min-height:37px;padding:.35rem .64rem;font-size:.9rem}details{margin-top:9px;color:#214a41}summary{min-height:36px;cursor:pointer;font-weight:750;display:list-item}.filterdetail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}.filterdetail select{padding:6px;border:1px solid #819b90;border-radius:7px;background:white}.sectionhead{display:flex;gap:12px;align-items:baseline;justify-content:space-between;margin:20px 0 7px}.sectionhead h2{margin:0;font:700 1.8rem Georgia,serif;letter-spacing:-.03em}.sectionhead p,.muted{margin:0;color:var(--dim);font-size:.89rem}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:17px;background:var(--white);min-width:0}.card h3{margin:.62rem 0 .22rem;font-size:1.22rem;line-height:1.17}.card p{color:var(--dim);margin:.38rem 0}.card small{font-size:.84rem}.card button{margin:8px 5px 0 0}.tag{display:inline-flex;gap:.4rem;align-items:center;padding:3px 9px;border-radius:8px;font-size:.83rem;font-weight:800}.tag.Funding{background:#e6ddfa;color:var(--violet)}.tag.Learning{background:#dbefef;color:#19575c}.tag.Mentoring{background:#f8e8c8;color:var(--amber)}.tag.Careers{background:#dcebe0;color:#275442}.wide{margin-top:10px}.note{border-left:3px solid #66a493;background:#ebf3ee;padding:11px 14px;border-radius:5px;color:#214a41;margin-top:12px}.deckarea{max-width:640px;margin:auto}.deckcard{min-height:218px;background:#fffefa;border:2px solid #99b6a9;border-radius:18px;padding:24px;box-shadow:0 7px 0 #d6e5dc;touch-action:pan-y}.deckcard h3{font:700 clamp(1.65rem,5vw,2.45rem)/1.05 Georgia,serif;margin:.6rem 0}.deckcard.intro{animation:swipehint .7s ease-out 1}@keyframes swipehint{35%{transform:translateX(8px) rotate(1deg)}70%{transform:translateX(-5px)}}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.row button{flex:1}.panel{background:var(--white);border:1px solid var(--line);padding:19px;border-radius:13px;margin-top:14px}.panel h2{margin-top:0}.panel dt{font-weight:750}.panel dd{margin:0 0 8px;color:var(--dim)}.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:white;padding:10px;z-index:4}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
body[data-role="ggp-match"] .hero{min-height:0;padding-block:17px}body[data-role="ggp-match"] .hero h1{max-width:none;font-size:clamp(1.8rem,4.6vw,3.3rem)}body[data-role="ggp-match"] .art{height:98px}body[data-role="ggp-match"] .sectionhead{margin-top:13px}body[data-role="ggp-match"] .note{margin-block:6px}body[data-role="ggp-match"] .controls{margin-top:11px}body[data-role="ggp-match"] .deckcard{min-height:175px}
@media(max-width:860px){.frame{grid-template-columns:170px minmax(0,1fr);gap:18px;padding:20px}}@media(max-width:690px){.frame{display:block;padding:10px 12px 32px}aside{position:static}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button{font-size:.9rem}.subnav{margin-top:9px}.subnav .nav{display:flex;overflow-x:auto;scrollbar-width:thin;padding:2px 1px 5px}.subnav .nav button{white-space:nowrap;flex:none}.railnote{display:none}.hero{min-height:0;margin-top:9px;grid-template-columns:minmax(0,1fr) 82px;gap:7px}.art{height:94px}.hero h1{font-size:clamp(1.95rem,8.5vw,3.4rem)}.hero p{font-size:.93rem}.grid{grid-template-columns:1fr}.strip{font-size:.7rem;padding:8px 12px}.caption{margin:3px 0 2px}.deckcard{padding:17px}.search{grid-template-columns:minmax(0,1fr) auto}.search button{padding:.5rem}.controls{margin-top:10px}.sectionhead{margin:13px 0 7px}}@media(max-width:480px){#roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}#roles button{white-space:nowrap;font-size:.76rem;padding:.24rem .1rem;text-align:center}.subnav .nav button{padding:.4rem .6rem;min-height:38px}.hero{padding:12px;grid-template-columns:minmax(0,1fr) 57px}.hero h1{font-size:1.85rem;max-width:none;margin:.28rem 0 .36rem}.hero p{font-size:.83rem;line-height:1.35}.art{height:57px}.caption{font-size:.7rem}.sectionhead h2{font-size:1.45rem}.deckcard{min-height:150px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.filters button{min-height:40px;font-size:.72rem;padding:.15rem .2rem;white-space:nowrap}.filterdetail{font-size:.87rem}.controls summary{min-height:30px}body[data-role="ggp-match"] .art{height:64px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body><a class="skip" href="#work">Skip to content</a><header class="strip"><strong>GGP / DIRECTORY + PIPELINE</strong><span>DESIGN REVIEW · DEMO DATA</span></header>
<div class="frame"><aside aria-label="Review navigation"><div class="caption">Choose a view</div><nav class="nav" id="roles" aria-label="Audience"></nav><div class="subnav" id="sub"></div><p class="railnote">Francesco review edition<br>Illustrative records only. Nothing is submitted or paid.</p></aside><main id="work" tabindex="-1"><section class="hero"><div><div class="eyebrow" id="kicker"></div><h1 id="title" tabindex="-1"></h1><p id="summary"></p></div><img class="art" id="art" src="art/wayfinding.svg" alt="" width="1344" height="752"></section><div id="body"></div><p class="sr" aria-live="polite" id="live"></p></main></div>
<script>
'use strict';
const rows=[
 ['Portfolio Studio','Learning','Students','Online','A guided portfolio critique with time to revise.','Example cohort opens in February.'],
 ['First Level Fellowship','Funding','Students','Hybrid','Small grants for an early playable project.','Example deadline: March 8.'],
 ['Open Door Mentors','Mentoring','All','Online','Meet a mentor to map your next three steps.','Example: rolling interest form.'],
 ['Sandbox Apprenticeship','Careers','Students','In person','A studio placement for early-career creators.','Example deadline: April 12.'],
 ['Classroom Play Lab','Learning','Educators','Online','A game-making lesson kit and facilitator clinic.','Example: available year round.'],
 ['New Voices Microgrants','Funding','All','Online','Modest funding for a first creative collaboration.','Example deadline: May 15.'],
 ['Signal Boost Network','Mentoring','Educators','Hybrid','Peer advising for educators supporting new talent.','Example: quarterly intake.'],
 ['Production Bridge','Careers','All','Hybrid','Practice studio workflows in a short team project.','Example: summer cohort.'],
 ['Open Tools Workshop','Learning','All','Online','Hands-on introduction to accessible game tools.','Example: rolling registration.'],
 ['Community Access Fund','Funding','All','Hybrid','Example travel and access support for makers.','Example deadline: June 1.']
];
const roles=['Student','Educator','Donor','GGP Match'],tags={Funding:'◇',Learning:'▤',Mentoring:'◎',Careers:'▦'},sets={Donor:['Programs','My Giving','Public Giving','News'],'GGP Match':['Find a Match','Your Matches','Give to GGP','Play','Explore Every Program']};
const head={Student:['START HERE','Your next possibility','Find funding, learning, mentors and first steps into games.'],Educator:['ADVISE WITH CONFIDENCE','The opportunity desk','Find and compare options you can share with your students.'],Donor:['SUPPORT WITH PURPOSE','Make a difference','Compare programs and see what each one helps make possible.'],'GGP Match':['FIND YOUR FIT','Good things match','Choose what matters to you, then keep or pass one program at a time.']};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');const find=(a,k)=>a.find(v=>slug(v)===k);
let role='Student',view='',query='',tag='',format='',limit=4,comp=[],kept=[],passed=[],history=[],intro=true,lastDeckId='',dialog=-1;const $=id=>document.getElementById(id),say=s=>{$('live').textContent=s};const clean=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tagged=r=>'<span class="tag '+r[1]+'"><span aria-hidden="true">'+tags[r[1]]+'</span>'+r[1]+'</span>';
const getList=()=>rows.map((v,i)=>[v,i]).filter(([v])=>(role==='Student'?v[2]!=='Educators':role==='Educator'?v[2]!=='Students':true)&&(!tag||tag===v[1])&&(!format||format===v[3])&&(!query||v.join(' ').toLowerCase().includes(query.trim().toLowerCase())));
function tile([r,i]){return '<article class="card">'+tagged(r)+'<h3>'+r[0]+'</h3><p>'+r[4]+'</p><small>'+r[3]+' · '+r[5]+'</small><div><button data-detail="'+i+'">Program details</button>'+(role==='Donor'?'<button data-compare="'+i+'" aria-pressed="'+comp.includes(i)+'">'+(comp.includes(i)?'Remove from compare':'Compare')+'</button>':'')+'</div></article>'}
function cardsHTML(list){return list.length?'<div class="grid">'+list.map(tile).join('')+'</div>':'<p class="note">No programs match those filters. Try another search or clear filters.</p>'}
function nav(){ $('roles').innerHTML=roles.map(s=>'<button data-role="'+slug(s)+'" aria-pressed="'+(s===role)+'">'+s+'</button>').join(''); $('sub').innerHTML=sets[role]?'<div class="caption">'+(role==='Donor'?'Giving desk':'Match workspace')+'</div><nav class="nav" aria-label="Section">'+sets[role].map(s=>'<button data-view="'+slug(s)+'" aria-pressed="'+(s===view)+'">'+s+'</button>').join('')+'</nav>':''}
function controls(){return '<section class="controls" aria-label="'+(role==='GGP Match'?'Filter match deck':'Find opportunities')+'"><label for="query">'+(role==='GGP Match'?'Filter this deck':'Search programs')+'</label><div class="search"><input id="query" type="search" placeholder="Try portfolio or mentoring" value="'+clean(query)+'"><button id="clear">Clear</button></div><div class="filters" aria-label="Program categories">'+['',...Object.keys(tags)].map(t=>'<button data-filter="'+t+'" aria-pressed="'+(t===tag)+'">'+(t?'<span aria-hidden="true">'+tags[t]+' </span>'+t:'All')+'</button>').join('')+'</div><details id="more"><summary>More filters</summary><div class="filterdetail"><label for="format">Format</label><select id="format">'+['','Online','Hybrid','In person'].map(f=>'<option '+(f===format?'selected ':'')+'value="'+f+'">'+(f||'Any format')+'</option>').join('')+'</select></div></details></section><div id="results"></div>'}
function renderContent(){const normal=role==='Student'||role==='Educator'||view==='Programs'||view==='Find a Match'||view==='Explore Every Program';
$('body').innerHTML=normal?controls():view==='Your Matches'?'<section class="panel"><h2>Saved matches</h2>'+ (kept.length?cardsHTML(kept.map(i=>[rows[i],i])):'<p>Programs you keep will appear here.</p>')+'</section>':view==='My Giving'?'<section class="panel"><h2>My Giving</h2><p>This sample does not connect to any account or display your giving history.</p></section>':view==='Public Giving'?'<section class="panel"><h2>Public Giving</h2><p>Explore example causes from Programs. This demo does not take donations or show real amounts.</p></section>':view==='News'?'<section class="panel"><h2>News</h2><p>Example update: A new guide to preparing a first game portfolio is in review.</p></section>':view==='Play'?'<section class="panel"><h2>Practice the gesture</h2><p>In Find a Match, swipe right to keep or left to pass. The labeled buttons do the same thing, and Undo restores the last card.</p><button data-view="find-a-match">Go to Find a Match</button></section>':'<section class="panel"><h2>Give to GGP</h2><p>This demo is for design review only. No payment is enabled.</p></section>';
if(normal)renderResults()}
function renderResults(){const out=$('results');if(!out)return;const list=getList();
if(role==='GGP Match'&&view==='Find a Match'){const remaining=list.filter(([,i])=>!kept.includes(i)&&!passed.includes(i));const item=remaining[0],newKey=item?item[1]:'';out.innerHTML='<section class="deckarea"><div class="sectionhead"><h2>Your deck</h2><p>'+remaining.length+' remaining · '+kept.length+' saved</p></div><p class="note">Swipe right to Keep, left to Pass. Or use the labeled buttons.</p>'+'<div class="row" style="margin:8px 0 11px"><button data-action="pass" '+(!item?'disabled':'')+'>Pass</button><button class="btn" data-action="keep" '+(!item?'disabled':'')+'>Keep</button><button data-action="undo" '+(!history.length?'disabled':'')+'>Undo</button></div>'+(item?'<article class="deckcard '+(intro&&lastDeckId!==newKey?'intro':'')+'" id="swipe">'+tagged(item[0])+'<h3>'+item[0][0]+'</h3><p>'+item[0][4]+'</p><small>'+item[0][3]+' · '+item[0][5]+'</small></article>':'<p class="note">No cards left for these filters.</p>')+'</section>';if(item){lastDeckId=newKey;const el=$('swipe');let x;el.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-x;if(Math.abs(d)>55)act(d>0?'keep':'pass')},{passive:true});}return;}
out.innerHTML='<div class="sectionhead"><h2>'+(role==='Donor'?'Programs':'Opportunities')+'</h2><p>'+Math.min(list.length,limit)+' of '+list.length+' shown</p></div>'+cardsHTML(list.slice(0,limit))+(list.length>limit?'<button class="wide" id="load">Load more programs</button>':'')+(role==='Donor'&&comp.length?'<section class="panel"><h2>Compare '+comp.length+' of 3</h2><div class="grid">'+comp.map(i=>tile([rows[i],i])).join('')+'</div></section>':'');}
function reset(){query='';tag='';format='';limit=4;dialog=-1}
function openRoute(){const [a,b]=location.hash.slice(1).split('/');let next=find(roles,a)||'Student';let subsection=sets[next]?(find(sets[next],b)||sets[next][0]):'';const move=next!==role||view!==subsection;if(move)reset();role=next;view=subsection;document.body.dataset.role=slug(role);const [k,t,d]=head[role];$('kicker').textContent=k;$('title').textContent=t;$('summary').textContent=d;$('art').src=role==='Donor'?'art/firefly-wayfinding.webp':'art/wayfinding.svg';nav();renderContent();if(move&&document.activeElement!==$('query'))$('title').focus({preventScroll:true})}
const route=(r,v='')=>{const h=slug(r)+(v?'/'+slug(v):'');if(location.hash.slice(1)===h)openRoute();else location.hash=h};
function act(a){if(a==='undo'){const last=history.pop();if(last){kept=kept.filter(x=>x!==last.i);passed=passed.filter(x=>x!==last.i);say('Last card restored');}}else{const item=getList().find(([,i])=>!kept.includes(i)&&!passed.includes(i));if(!item)return;const i=item[1];(a==='keep'?kept:passed).push(i);history.push({i});intro=false;say((a==='keep'?'Kept ':'Passed ')+item[0][0]);} renderResults();const target=document.querySelector('[data-action="'+a+'"]');if(target&&!target.disabled)target.focus();}
document.addEventListener('input',e=>{if(e.target.id==='query'){query=e.target.value;limit=4;renderResults();say(getList().length+' matching programs')}});
document.addEventListener('change',e=>{if(e.target.id==='format'){format=e.target.value;limit=4;renderResults();say(getList().length+' matching programs')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.role)return route(find(roles,d.role));if(d.view)return route(role,find(sets[role],d.view));
if('filter'in d){tag=d.filter;limit=4;document.querySelectorAll('[data-filter]').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.filter===tag)));renderResults();say(getList().length+' matching programs');return}
if(b.id==='clear'){reset();renderContent();$('query').focus();say('Filters cleared');return}
if(b.id==='load'){const old=limit;limit+=4;renderResults();const target=$('results').querySelectorAll('.card h3')[old];if(target){target.tabIndex=-1;target.focus({preventScroll:true});target.scrollIntoView({block:'nearest'});}say(Math.min(limit,getList().length)+' programs shown');return}
if(d.action)return act(d.action);
if('compare'in d){const i=+d.compare;if(comp.includes(i))comp=comp.filter(x=>x!==i);else if(comp.length<3)comp.push(i);else{say('Compare up to three programs. Remove one to add another.');return;}renderResults();const target=$('results').querySelector('[data-compare="'+i+'"]');if(target)target.focus();say(comp.length+' selected for comparison');return}
if('detail'in d){dialog=+d.detail;const r=rows[dialog];const node=document.createElement('dialog');node.className='panel';node.setAttribute('aria-label',r[0]+' details');node.innerHTML='<h2>'+r[0]+'</h2><dl><dt>Eligibility</dt><dd>'+r[2]+'</dd><dt>Format</dt><dd>'+r[3]+'</dd><dt>Timing</dt><dd>'+r[5]+'</dd><dt>Source</dt><dd>Fictional example for design review.</dd></dl><form method="dialog"><button>Close details</button></form>';document.body.append(node);node.addEventListener('close',()=>{node.remove();b.focus();});node.showModal();}
});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();$('work').focus();});addEventListener('hashchange',openRoute);openRoute();
</script></body></html>
