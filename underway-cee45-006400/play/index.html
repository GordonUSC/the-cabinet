<style>

.rally{display:grid;gap:8px;margin-top:10px}.rally div{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center}.rally i{height:22px;border-radius:6px;background:var(--c5);border:2px solid var(--ink);display:block}.rally b{font-variant-numeric:tabular-nums;text-align:right}

    <h1 id="title">Underway</h1>

    <div id="body"><p class="lead">Every Rickoid's summer, played together. One tap at a time. You cannot lose.</p>
      <noscript><p><b>This game needs JavaScript to play.</b> The story: in 1983 a $250 lecture fee seeded the Center for Excellence in Education. Each summer since 1984, students spend a week in classes, five weeks in a lab with a mentor, and then present their research. About 3,400 Rickoids from all 50 states and 63 nations have made that journey. This game lets you live one summer, and ends with a thank-you to Ms. D and the CEE team.</p></noscript>
    </div>
    <div id="choices"></div>

</div>
<div id="watching" hidden>Watching. Tap the picture to take over.</div>
<script type="module">
const L = (() => {
// Underway: pure game logic (no DOM). Shared by the page and the balance simulator.
const TARGETS = [38, 135, 300, 480, 820]; // week 1..5, visible to the player
const ACTIONS_PER_WEEK = 3;

const FIELDS = [
  { id: 'math', name: 'Mathematics', mentor: 'math' },
  { id: 'bio', name: 'Biology', mentor: 'bio' },
  { id: 'cs', name: 'Computer Science', mentor: 'cs' },
  { id: 'eng', name: 'Engineering', mentor: 'eng' },
  { id: 'phys', name: 'Physics', mentor: 'math' },
  { id: 'chem', name: 'Chemistry', mentor: 'bio' },
];

const MENTORS = {
  math: { name: 'The Theorist', art: 'art_mentor_math.jpg', line: 'Prove it twice, then once more.', gain: { insight: 1, rigor: 2 } },
  bio: { name: 'The Experimentalist', art: 'art_mentor_bio.jpg', line: 'Let the data surprise you.', gain: { insight: 3, rigor: 0 } },
  cs: { name: 'The Builder', art: 'art_mentor_cs.jpg', line: 'Make it run, then make it right.', gain: { insight: 2, rigor: 1 } },
  eng: { name: 'The Tinkerer', art: 'art_mentor_eng.jpg', line: 'Test it until it stops breaking.', gain: { insight: 1, rigor: 2 } },
};

const UPGRADES = [
  { id: 'partner', name: 'Your counselor group', text: '+1 Rigor at the start of every week. Never be late to Bedcheck.' },
  { id: 'lounge', name: 'Late nights in the computer lab', text: '+1 action every week. Lose 1 Rigor now.' },
  { id: 'notebook', name: 'A careful notebook', text: 'Rigor counts 1.5 times at week\'s end.' },
  { id: 'question', name: 'One good question', text: '+3 Insight right now.' },
  { id: 'office', name: 'Office hours', text: 'Ask your mentor twice a week.' },
  { id: 'wind', name: 'Second wind', text: 'Insight counts 1.5 times at week\'s end.' },
  { id: 'care', name: 'Care package from home', text: '+2 Insight and +2 Rigor right now.' },
];

function newRun(fieldId, rng = Math.random) {
  const f = FIELDS.find((x) => x.id === fieldId) || FIELDS[0];
  return { field: f.id, mentor: f.mentor, insight: 2, rigor: 2, week: 1, actionsLeft: ACTIONS_PER_WEEK, mentorAsks: 0,
    upgrades: [], weekScores: [], stamps: 0, total: 0, failChoice: null, log: [], rng };
}

const has = (s, id) => s.upgrades.includes(id);

function startWeek(s) {
  s.actionsLeft = ACTIONS_PER_WEEK + (has(s, 'lounge') ? 1 : 0);
  s.mentorAsks = 0;
  if (has(s, 'partner')) s.rigor += 1;
  if (s.week === 4 && !s.failed) { s.failed = true; s.lostInsight = Math.floor(s.insight / 2); s.insight -= s.lostInsight; }
  return s;
}

function availableActions(s) {
  const maxAsk = has(s, 'office') ? 2 : 1;
  const g = MENTORS[s.mentor].gain;
  return [
    { id: 'experiment', name: 'Run an experiment', text: '+3 Insight. Sometimes a surprise adds 2 more.', ok: true },
    { id: 'check', name: 'Check your work', text: '+2 Rigor.', ok: true },
    { id: 'mentor', name: 'Ask your mentor', text: `+${g.insight} Insight, +${g.rigor} Rigor. ${maxAsk === 2 ? 'Twice a week.' : 'Once a week.'}`, ok: s.mentorAsks < maxAsk },
    { id: 'read', name: 'Read the literature', text: '+1 Insight, +1 Rigor.', ok: true },
  ];
}

function act(s, id) {
  if (s.actionsLeft <= 0) return null;
  let out = { insight: 0, rigor: 0, surprise: false };
  if (id === 'experiment') { out.insight = 3; if (s.rng() < 0.3) { out.insight += 2; out.surprise = true; } }
  else if (id === 'check') out.rigor = 2;
  else if (id === 'read') { out.insight = 1; out.rigor = 1; }
  else if (id === 'mentor') {
    const maxAsk = has(s, 'office') ? 2 : 1;
    if (s.mentorAsks >= maxAsk) return null;
    s.mentorAsks += 1; out = { ...out, ...MENTORS[s.mentor].gain };
  } else return null;
  s.insight += out.insight; s.rigor += out.rigor; s.actionsLeft -= 1;
  return out;
}

function weekScore(s) {
  const i = s.insight * (has(s, 'wind') ? 1.5 : 1);
  const r = s.rigor * (has(s, 'notebook') ? 1.5 : 1);
  return { i, r, score: Math.floor(i * r), target: TARGETS[s.week - 1] };
}

function endWeek(s) {
  const w = weekScore(s);
  const stamp = w.score >= w.target;
  s.weekScores.push(w.score); s.total += w.score; if (stamp) s.stamps += 1;
  s.week += 1;
  return { ...w, stamp };
}

function offerUpgrades(s) {
  const pool = UPGRADES.filter((u) => !has(s, u.id));
  const pick = [];
  while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.floor(s.rng() * pool.length), 1)[0]);
  return pick;
}

function takeUpgrade(s, id) {
  s.upgrades.push(id);
  if (id === 'lounge') s.rigor = Math.max(1, s.rigor - 1);
  if (id === 'question') s.insight += 3;
  if (id === 'care') { s.insight += 2; s.rigor += 2; }
}

// Week 4: the experiment failed. Both paths win. Reading the failure is a deduction, not a dice roll:
// the player reads one clue and picks the explanation that fits it. A wrong pick gives a hint and a retry.
const FAIL_CLUES = {
  math: { clue: 'Your bound holds for every case you tried, except one small one.', good: 0,
    reads: ['That case breaks a hidden assumption. The theorem needs one more condition.', 'Small cases never matter. Ignore it.', 'The computer must have made an arithmetic slip.'],
    hint: 'A single counterexample is information. What would make it fail only there?' },
  bio: { clue: 'This week the seedlings under white light grew fast too.', good: 1,
    reads: ['Blue light simply stopped working.', 'Something changed for every plant, like the room\'s temperature.', 'The ruler must have shrunk.'],
    hint: 'When the comparison group moves too, look for what all the plants share.' },
  cs: { clue: 'The new sort is slower, but only on data that is already sorted.', good: 2,
    reads: ['The new method is just bad.', 'The timer is broken.', 'Sorted input is its worst case. That is a result worth reporting.'],
    hint: 'It only fails on one kind of input. What is special about that input?' },
  eng: { clue: 'The bridge cracked at a joint, not in the middle of a beam.', good: 0,
    reads: ['The joints, not the beams, are the weak point to redesign.', 'Bridges always crack. Try again.', 'The weights were too heavy for any design.'],
    hint: 'Where it broke tells you what to change.' },
  phys: { clue: 'The pendulum drifts more on warm afternoons than in the morning.', good: 1,
    reads: ['Pendulums are random.', 'Heat changes the string\'s length, and that changes the swing.', 'The clock in the room is wrong.'],
    hint: 'The drift follows the time of day. What else changes over the day?' },
  chem: { clue: 'The indicator changed color before you added any acid.', good: 2,
    reads: ['The indicator is broken for good.', 'Color is not a real measurement.', 'Something in the water was already acidic. Check the control.'],
    hint: 'If it changed before you did anything, the cause was already there.' },
};
function resolveFailure(s, choice) {
  s.failChoice = choice;
  if (choice === 'restart') { s.rigor += 4; return { kind: 'restart', rigor: 4 }; }
  const back = s.lostInsight + 4; s.insight += back; return { kind: 'found', insight: back };
}

function greedyAction(s) {
  // The move a careful player makes: keep Insight and Rigor balanced, mentor first.
  const acts = availableActions(s);
  if (acts.find((a) => a.id === 'mentor').ok) return 'mentor';
  return s.insight <= s.rigor * 1.3 ? 'experiment' : 'check';
}

return {TARGETS, ACTIONS_PER_WEEK, FIELDS, MENTORS, UPGRADES, newRun, startWeek, availableActions, act, weekScore, endWeek, offerUpgrades, takeUpgrade, FAIL_CLUES, resolveFailure, greedyAction};
})();
// Underway: screens and flow. Logic lives in logic.js (inlined at build as L).
const $ = (s) => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('underway.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('underway.' + k, JSON.stringify(v)); } catch (e) { /* private window: play on */ } },
};

const ARCHIVE = [
  { id: 'founded', t: '1983', b: 'Admiral H.G. Rickover and Joann P. DiGennaro found the Center for Excellence in Education. It is first called the Admiral Rickover Foundation.' },
  { id: 'seed', t: 'The $250 seed', b: 'By CEE\'s own account, its funding began with the $250 Admiral Rickover was paid for a university lecture.' },
  { id: 'rsi', t: '1984', b: 'The first summer of what becomes the Research Science Institute. It begins as the Rickover Science Institute.' },
  { id: 'summer', t: 'Six weeks', b: 'A week of classes, a five-week research internship with a mentor, then written and oral presentations. About 100 students come to MIT each summer.' },
  { id: 'stanford', t: '2027', b: 'RSI grows to a second campus, with about 50 young scholars at Stanford.' },
  { id: 'rickoids', t: 'Rickoids', b: 'CEE\'s name for RSI alumni, after Admiral Rickover. About 3,400 of them, from all 50 states and 63 nations.' },
  { id: 'double', t: 'Double Rickoids', b: 'Alumni of both RSI and the USA Biolympiad finals. Only 22 people hold the title.' },
  { id: 'roty', t: 'Rickoids of the Year', b: 'Every summer since 1984, each class votes for its own Rickoid of the Year. CEE still names one every year.' },
  { id: 'leesburg', t: 'Leesburg, 1984', b: 'The very first summer was not at MIT. About 50 students met at a training center in Leesburg, Virginia.' },
  { id: 'mit', t: 'MIT, 1992', b: 'RSI\'s first summer at MIT, a trial year. The final talks were given in Room 6-120.' },
  { id: 'bedcheck', t: 'Bedcheck', b: 'The nightly meeting with your counselor group. Rickoids across the decades agree: never be late to Bedcheck.' },
  { id: 'hellweek', t: 'Hell Week', b: 'What Rickoids call the last week: the final paper and talk, and long nights in the computer lab.' },
  { id: 'party', t: 'The holiday party', b: 'Ms. D hosts a holiday party at her home each year, with alumni from every decade. Boston has its own Bash.' },
  { id: 'broad', t: '35 and 40', b: 'The 35th and 40th anniversaries were weekends at the Broad Institute, with alumni talks and medals for excellence.' },
];
const TIMELINE = [
  [1983, 'A $250 lecture fee seeds a new foundation.'], [1984, 'About 50 students, one summer in Leesburg, Virginia.'],
  [1992, 'RSI\'s first summer at MIT.'], [2001, 'A sister institute opens in Bulgaria.'], [2018, 'The 35th: nearly 300 alumni gather at the Broad.'],
  [2023, 'The 40th, celebrated on the Senate floor.'], [2027, 'Stanford joins MIT as a summer home.'], [2028, 'Forty-five years. Underway.'],
];
const QUIZ = [
  { q: 'Your claim: "This plant grows faster in blue light." Which evidence fits?', a: ['Heights measured every day, in blue light and in white', 'A friend says blue is a nice color'], good: 0 },
  { q: 'Your claim: "This sorting method is faster." Which evidence fits?', a: ['It feels faster when I watch it', 'Timings on the same data, run many times'], good: 1 },
  { q: 'Your claim: "The bridge design holds more weight." Which evidence fits?', a: ['Load tests on three builds of each design', 'The drawing looks stronger'], good: 0 },
];
const TITLES = {
  math: ['A Tighter Bound for Tiling Problems', 'Counting Paths on Curious Grids', 'Symmetry in Small Graphs'],
  bio: ['How Light Color Shapes Seedling Growth', 'Mapping a Protein\'s Busy Day', 'Tiny Signals in Cell Repair'],
  cs: ['Sorting Faster with Less Memory', 'Teaching a Model to Say "I\'m Not Sure"', 'Finding Bugs Before They Hatch'],
  eng: ['A Lighter Bridge That Holds More', 'A Robot Hand That Learns Grip', 'Cooling Chips with Clever Fins'],
  phys: ['Listening for Ripples in Noisy Data', 'Why This Pendulum Misbehaves', 'Light Through Twisted Layers'],
  chem: ['A Cleaner Route to a Useful Catalyst', 'Colors That Report Acidity', 'Watching a Reaction Change Its Mind'],
};

let S = { mode: 'play', year: null, run: null, poster: null, watchTimer: null };
window.__underway = { get state() { return document.body.dataset.scene; }, get S() { return S; } };

const archive = new Set(store.get('archive', []));
function unlock(...ids) { let n = 0; ids.forEach((i) => { if (!archive.has(i)) { archive.add(i); n++; } }); store.set('archive', [...archive]); return n; }

// ---------- stage (illustrations, crossfaded, with a slow drift) ----------
const ROOM_ART = { classroom: 'art_classroom.jpg', lab: 'art_lab.jpg', hall: 'art_hall.jpg', party: 'art_party.jpg' };
let artTok = 0;
function stage({ room, art, alt }) {
  const src = 'assets/' + (art || ROOM_ART[room]) + '?v=1120b';
  const img = $('#art'), under = $('#art2');
  if (img.getAttribute('src') === src) { img.alt = alt || ''; return; }
  const tok = ++artTok;
  const pre = new Image();
  pre.onload = pre.onerror = () => {
    if (tok !== artTok) return;
    under.src = img.getAttribute('src') || src; under.hidden = false;
    img.classList.remove('in'); void img.offsetWidth;

const SND = (() => {
  const FILES = { tap: 'sfx_tap', page: 'sfx_page', stamp: 'sfx_stamp', miss: 'sfx_miss', applause: 'sfx_applause', fail: 'sfx_fail', plant: 'sfx_plant', spark: 'sfx_spark', count: 'sfx_count',
    m_lab: 'music_lab', m_party: 'music_party', m_stars: 'music_stars', a_lab: 'amb_lab', a_party: 'amb_party' };
  const VOL = { tap: 0.5, page: 0.45, stamp: 0.9, miss: 0.8, applause: 0.9, fail: 0.85, plant: 0.9, spark: 0.75, count: 0.6 };
  let ctx = null, master = null, muted = store.get('muted', false);

  let want = { music: null, amb: null };

    loading[k] = fetch('assets/audio/' + FILES[k] + '.mp3?v=1120b').then((r) => r.arrayBuffer())

    if (cur.src) { const old = cur; old.g.gain.cancelScheduledValues(now); old.g.gain.setTargetAtTime(0, now, 0.5); setTimeout(() => { try { old.src.stop(); } catch (e) {} }, 2500); }

  $('#stars').hidden = true;
  stage({ room: 'party', alt: 'A cozy living room at a holiday party: a decorated tree, a fireplace, armchairs and a table of cookies.' });
  page({ scene: 'party', hud: false, eyebrow: 'The hub', title: 'Ms. D\'s holiday party',
    html: `<p class="lead">${fromRun ? 'You made it. Everyone is here, from every decade.' : 'Everyone is here, from every decade.'}</p>`, auto: 0,
    choices: [
      { id: 'thanks', label: 'The thank-you wall', sub: 'For Ms. D and the CEE team', card: true, primary: !!fromRun, fn: () => thanks() },
      { id: 'stories', label: 'Ornaments on the tree', sub: 'Stories from every decade', card: true, fn: () => stories() },
      { id: 'wall', label: 'The proceedings', sub: `${store.get('wall', []).length} paper(s) presented on this device`, card: true, fn: () => wall() },
      { id: 'rally', label: 'Every decade, together', sub: 'One light, added up across the years', card: true, fn: () => rally() },
      { id: 'archive', label: 'The archive', sub: `${archive.size} of ${ARCHIVE.length} cards found`, card: true, fn: () => arch() },
      { id: 'again', label: fromRun ? 'Pass to the next player' : 'Begin a summer', card: true, fn: () => title() },
    ] });
}
const back = { id: 'back', label: 'Back to the party', primary: true, fn: () => party() };
function thanks() {
  page({ scene: 'thanks', hud: false, eyebrow: 'The thank-you wall', title: 'Thank you, Ms. D.',
    html: '<p class="lead">For forty-five years of believing that young people can do serious work, and for the team at CEE who make every summer happen.</p><div class="tbd"><b>Coming for 2028</b><p>Here, alumni from every decade will say thank you in their own recorded voices. Collecting begins with the community\'s blessing.</p></div>',
    // In Just Watch, the thank-you is the ending: the story then loops from the start as a demo.
    choices: S.mode === 'watch' ? [{ id: 'loop', label: 'Watch again from the start', primary: true, fn: () => who() }, back] : [back] });
}
function stories() {
  const prompts = ['The night my experiment finally worked', 'What my mentor told me that I still use', 'The friend I met in week one', 'What I would tell this summer\'s class'];
  page({ scene: 'stories', hud: false, eyebrow: 'Ornaments on the tree', title: 'Stories from every decade',
    html: `<div class="tbd"><b>Coming for 2028</b><p>Each ornament will hold a real story from a Rickoid, shared with their permission. These are the questions we will ask:</p></div><ul class="orn">${prompts.map((p, i) => `<li style="--c:var(--c${i + 1})">${p}</li>`).join('')}</ul>`, choices: [back] });
}
function wall() {
  const w = store.get('wall', []);
  page({ scene: 'wall', hud: false, eyebrow: 'The proceedings', title: 'Papers presented on this device',
    html: w.length ? `<div class="wall">${w.map((p) => `<div class="poster sm"><span>${p.field} · ${p.year}</span><b>${p.title}</b><em>${p.total} ${stamps(p.stamps)}</em></div>`).join('')}</div>` : '<p>No papers yet. Play a summer and yours will be added here.</p>', choices: [back] });
}
function rally() {
  const order = ['1980s', '1990s', '2000s', '2010s', '2020s', 'Friends'];
  const r = store.get('rally', {}); const rows = order.filter((y) => r[y]).map((y) => [y, r[y]]); const sum = rows.reduce((a, [, v]) => a + v, 0) || 1;
  page({ scene: 'rally', hud: false, eyebrow: 'Every decade, together', title: rows.length ? `${rows.reduce((a, [, v]) => a + v, 0)} points of light` : 'One light, added up',
    html: (rows.length ? `<div class="together" role="img" aria-label="Each decade's share of the light">${rows.map(([y, v], k) => `<i style="flex:${v};--c:var(--c${(k % 5) + 1})" title="${y}"></i>`).join('')}</div><div class="rally">${rows.map(([y, v]) => `<div><span>${y}</span><i style="width:${Math.max(6, v / sum * 100)}%"></i><b>${v}</b></div>`).join('')}</div>` : '<p>No light yet. The first summer played starts it.</p>') + '<p class="small">Totals are kept on this device. Every decade adds to the same light.</p>', choices: [back] });
}
function arch() {
  page({ scene: 'archive', hud: false, eyebrow: 'The archive', title: `${archive.size} of ${ARCHIVE.length} cards found`,
    html: `<div class="arch">${ARCHIVE.map((a) => (archive.has(a.id) ? `<div class="ac on"><b>${a.t}</b><p>${a.b}</p></div>` : '<div class="ac"><b>?</b><p>Keep playing to find this card.</p></div>')).join('')}</div><p class="small">From CEE's own record. Counts change each year.</p>`, choices: [back] });
}

document.addEventListener('pointerdown', () => SND.unlock(), { capture: true });
document.addEventListener('keydown', () => SND.unlock(), { capture: true });
document.addEventListener('pointerdown', (e) => { if (S.mode === 'watch' && !e.target.closest('button')) { S.mode = 'play'; clearTimeout(S.watchTimer); $('#watching').hidden = true; } });
const mute = $('#mute');
const drawMute = () => { mute.setAttribute('aria-pressed', String(SND.muted)); mute.setAttribute('aria-label', SND.muted ? 'Sound is off. Turn sound on' : 'Sound is on. Turn sound off'); mute.querySelector('span').textContent = SND.muted ? 'Sound off' : 'Sound on'; };
mute.addEventListener('click', (e) => { e.stopPropagation(); SND.setMuted(!SND.muted); drawMute(); });
drawMute();
title();

</script>
