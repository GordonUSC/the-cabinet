<script type="module">
const L = (() => {
// Underway v5, "The Hunch": pure game logic (no DOM). Shared by the page and the balance simulator.
// One verb (look closer, with three tools), one decision (make your hunch). No arithmetic is ever shown:
// the player sees stars, never a sum.

// Each lab week is one hidden picture. Generic science subjects only (truth rule: no real alumni projects,
// no invented results). Facts are standard textbook science. Coordinates are fractions of the picture.
const WEEKS = [
  { wk: 1, id: 'snow', art: 'hunch_snow', tools: ['look'], answer: 1,
    choices: ['A spider web', 'A snowflake', 'A dandelion'], sheet: 'hunch_choices1', sheetOrder: [1, 0, 2],
    mentor: null, word: null,
    found: 'A snowflake!', fact: 'Snowflakes grow in six-sided shapes because water molecules freeze into a hexagon.' },
  { wk: 2, id: 'feather', art: 'hunch_feather', tools: ['look', 'mentor', 'read'], answer: 2,
    choices: ['A fern leaf', 'A fish skeleton', 'A feather'], sheet: 'hunch_choices2', sheetOrder: [0, 2, 1],
    mentor: { x: 0.64, y: 0.62, r: 0.2, line: 'Look at the edge. See the tiny hooks?' }, word: 'Flight',
    found: 'A feather!', fact: 'A feather\'s barbs zip together with tiny hooks, so it holds its shape in flight.' },
  { wk: 3, id: 'pinecone', art: 'hunch_pinecone', tools: ['look', 'mentor', 'read'], answer: 0,
    choices: ['A pinecone', 'A sunflower', 'A pineapple'], sheet: 'hunch_choices3', sheetOrder: [2, 0, 1],
    // The word clue misleads on purpose: the label names a cousin with the same spirals. The evidence wins.
    mentor: { x: 0.5, y: 0.5, r: 0.2, line: 'A label can fool you. Trust what you see.' }, word: 'Sunflower?', misleading: true,
    found: 'A pinecone!', fact: 'A pinecone\'s scales grow in spirals, often 8 one way and 13 the other. Sunflowers use the same numbers, which is why the label fooled you.' },
  { wk: 4, id: 'dish', art: 'hunch_dish', twist: 'hunch_dish_twist', tools: ['look', 'mentor', 'read'], answer: 0,
    choices: ['Bacteria in a dish', 'Swiss cheese', 'A starry sky'], sheet: 'hunch_choices4', sheetOrder: [0, 1, 2],
    mentor: { x: 0.43, y: 0.5, r: 0.22, line: 'Count the little dots. What grows like that?' }, word: 'Culture',
    found: 'Bacteria in a dish!', fact: 'In 1928 a mold spoiled a dish of bacteria in Alexander Fleming\'s lab. The clear ring around it led him to penicillin.' },
];

const MENTOR_SURPRISE = 'That is not a mistake. That is a discovery.';

function newRun(rng = Math.random) {
  return { week: 1, looks: 0, misses: 0, mentorUsed: false, readUsed: false, revealed: [], found: [], stars: [], stamps: 0, order: null, rng };
}

  const c = $('#stars'); c.hidden = false; const r = $('#stage').getBoundingClientRect(); c.width = r.width * 2; c.height = r.height * 2;
  const x = c.getContext('2d'); let seed = 45; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pts = Array.from({ length: 3400 }, () => [rnd() * c.width, rnd() * c.height * 0.62, rnd()]);
  let n = REDUCED ? 3400 : 0;
  const draw = () => {
    if (c.hidden) return; x.clearRect(0, 0, c.width, c.height);
    for (let i = 0; i < n; i++) { const p = pts[i]; x.fillStyle = `rgba(255,${230 + p[2] * 25 | 0},${170 + p[2] * 80 | 0},${0.35 + p[2] * 0.6})`; x.fillRect(p[0], p[1], 1.5 + p[2] * 2, 1.5 + p[2] * 2); }
    if (n >= 3400) { x.beginPath(); x.arc(c.width / 2, c.height * 0.3, 9, 0, 7); x.fillStyle = '#ffd76a'; x.fill(); x.beginPath(); x.arc(c.width / 2, c.height * 0.3, 22, 0, 7); x.strokeStyle = 'rgba(255,215,106,.7)'; x.lineWidth = 3; x.stroke(); return; }
    n = Math.min(3400, n + 60); requestAnimationFrame(draw);

}

function wall() {
  const w = store.get('wall', []);
  page({ scene: 'wall', hud: false, eyebrow: 'The proceedings', title: 'Papers presented on this device',
    html: w.length ? `<div class="wall">${w.map((p) => `<div class="poster sm"><span>${p.field} · ${p.year}</span><b>${p.title}</b><em>${p.total} gold stars ${stamps(p.stamps)}</em></div>`).join('')}</div>` : '<p>No papers yet. Play a summer and yours will be added here.</p>', choices: [back] });
}
// Counts only, never names: how many played from each class year on this device, and the fewest looks to a 3-star hunch.
function playersLine() {
  const order = ['1980s', '1990s', '2000s', '2010s', '2020s', 'Friends'], p = store.get('players', {});
  const rows = order.filter((y) => p[y]).map((y) => {
    const f = store.get('fewest.r.' + y, null), g = store.get('fewest.' + y, null);
    const best = f !== null ? ` · Rickoid mode: found it in ${f}` : g !== null ? ` · found it in ${g}` : '';
    return `<li><b>${y}</b> ${p[y]} player${p[y] === 1 ? '' : 's'}${best}</li>`;
  });
  return rows.length ? `<h2 class="shelf">Who played, by class year</h2><ul class="byyear">${rows.join('')}</ul>` : '';
}
function rally() {
  const order = ['1980s', '1990s', '2000s', '2010s', '2020s', 'Friends'];
  const r = store.get('rally', {}); const rows = order.filter((y) => r[y]).map((y) => [y, r[y]]); const sum = rows.reduce((a, [, v]) => a + v, 0) || 1;
  page({ scene: 'rally', hud: false, eyebrow: 'Every decade, together', title: rows.length ? `${rows.reduce((a, [, v]) => a + v, 0)} points of light` : 'One light, added up',
    html: (rows.length ? `<div class="together" role="img" aria-label="Each decade's share of the light">${rows.map(([y, v], k) => `<i style="flex:${v};--c:var(--c${(k % 5) + 1})" title="${y}"></i>`).join('')}</div><div class="rally">${rows.map(([y, v]) => `<div><span>${y}</span><i style="width:${Math.max(6, v / sum * 100)}%"></i><b>${v}</b></div>`).join('')}</div>` : '<p>No light yet. The first summer played starts it.</p>') + playersLine() + '<p class="small">Totals are kept on this device. Every decade adds to the same light.</p>', hold: 20000, choices: SCREEN ? [{ id: 'next', label: 'The thank-you wall', primary: true, fn: () => { S.rallied = true; thanks(); } }, back] : [back] });
}
function arch() {
  page({ scene: 'archive', hud: false, eyebrow: 'The archive', title: `${archive.size} of ${ARCHIVE.length} cards found`,
    html: `<div class="arch">${ARCHIVE.map((a) => (archive.has(a.id) ? `<div class="ac on"><b>${a.t}</b><p>${a.b}</p></div>` : '<div class="ac"><b>?</b><p>Keep playing to find this card.</p></div>')).join('')}</div><h2 class="shelf">Alumni voices</h2><div class="arch">${['A Rickoid from the 1980s', 'A Rickoid from the 2000s', 'A Rickoid from the 2020s'].map((t) => `<div class="ac voice"><b>${t}</b><p>Coming in CEE's 45th film.</p></div>`).join('')}</div><p class="small">From CEE's own record. Counts change each year.</p><p class="credits">Art: drawn with Higgsfield. Music and sound: ElevenLabs. Finale stars: Unity, over Sidney Hall's star atlas <i>Urania's Mirror</i> (1825, public domain, restoration by Adam Cuerden, via Wikimedia Commons). MIT Great Dome photo: Fcb981, edited by Thermos, CC BY-SA 3.0, via Wikimedia Commons.</p>`, choices: [back] });
}

if (SCREEN) { document.body.classList.add('screen'); const q = $('#screenqr'); if (q) q.hidden = false; }
document.addEventListener('pointerdown', () => SND.unlock(), { capture: true });
document.addEventListener('keydown', () => SND.unlock(), { capture: true });
document.addEventListener('pointerdown', (e) => { if (S.mode === 'watch' && !SCREEN && !e.target.closest('button')) { S.mode = 'play'; clearTimeout(S.watchTimer); $('#watching').hidden = true; } });
const mute = $('#mute');
const drawMute = () => { mute.setAttribute('aria-pressed', String(SND.muted)); mute.setAttribute('aria-label', SND.muted ? 'Sound is off. Turn sound on' : 'Sound is on. Turn sound off'); mute.querySelector('span').textContent = SND.muted ? 'Sound off' : 'Sound on'; };
mute.addEventListener('click', (e) => { e.stopPropagation(); SND.setMuted(!SND.muted); drawMute(); });
drawMute();
title();

</script>
</body></html>
