<title id="scene-title">A fictional workshop viewed from above</title><desc id="scene-desc">Two workstations face each other across a long table. One chair is tucked in, the other pulled away. A cup has spilled beside a tool. Two separated controls are connected to a shutter. A window casts light across the floor. The diagram supports more than one interpretation.</desc>
